<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D6B58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="值勤打卡">
<title>值勤打卡</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#EEF2F0; --card:#FFFFFF; --ink:#15221E; --muted:#5A6A65; --line:#D3DCD8; --sunk:#E3E9E6;
    --accent:#1D6B58; --accent-ink:#FFFFFF; --dark:#15221E; --dark-ink:#FFFFFF;
    --ok:#2C7A4B; --ok-soft:#DCF0E3; --bad:#B0281F; --bad-soft:#F7DEDB; --warn:#9A5B00; --warn-soft:#F8E9CF;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#0E1412; --card:#16201C; --ink:#E4EDE9; --muted:#93A49E; --line:#2A3833; --sunk:#1D2925;
    --accent:#4DB596; --accent-ink:#06211A; --dark:#E4EDE9; --dark-ink:#0E1412;
    --ok:#5BC488; --ok-soft:#173326; --bad:#F07870; --bad-soft:#3D1D1A; --warn:#E2A644; --warn-soft:#3A2C12; color-scheme:dark}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5;
    padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0px))}
  .wrap{max-width:460px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}

  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .org{font-weight:700;font-size:17px}
  .date{color:var(--muted);font-size:13px}
  .clock{font-size:34px;font-weight:600;line-height:1}
  .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:4px}
  .net{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
  .net.off{background:var(--bad-soft);color:var(--bad)}
  .lang{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500}

  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);padding:4px;border-radius:12px;gap:4px}
  .tabs button{border:0;background:none;padding:10px 0;border-radius:9px;font-weight:700;color:var(--muted)}
  .tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;line-height:20px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
  label{font-size:13px;color:var(--muted);font-weight:500}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .roles button{padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500}
  .roles button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
  .status{font-size:14px;color:var(--muted)}

  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .big{padding:22px 8px;border:0;border-radius:14px;font-size:22px;font-weight:700;width:100%}
  .in{background:var(--accent);color:var(--accent-ink)}
  .out{background:var(--dark);color:var(--dark-ink)}
  .big:disabled{opacity:.45}

  .res{border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:4px}
  .res.ok{background:var(--ok-soft);color:var(--ok)}
  .res.bad{background:var(--bad-soft);color:var(--bad)}
  .res.wait{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .res.warn{background:var(--warn-soft);color:var(--warn)}
  .res b{font-size:19px}
  .res .tm{font-size:42px;font-weight:600;line-height:1.1}

  .cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:100%}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .frame{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
  .cam .tip{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:14px}

  .log{display:flex;flex-direction:column}
  .log .it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .log .it:last-child{border-bottom:0}
  .log .t{color:var(--muted);font-size:14px}
  .log .n{font-weight:500;min-width:0;overflow-wrap:anywhere}
  .pill{font-size:12px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .p-ok{background:var(--ok-soft);color:var(--ok)}
  .p-wait{background:var(--warn-soft);color:var(--warn)}
  .p-bad{background:var(--bad-soft);color:var(--bad)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:9px;font-size:14px;font-weight:500}
  .help{font-size:13px;color:var(--muted)}
  .help ol{margin:6px 0 0;padding-left:20px}
  .setup{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="org" id="org" data-t="title">值勤打卡</div>
      <div class="date" id="date"></div>
    </div>
    <div style="text-align:right">
      <div class="clock mono" id="clock">--:--</div>
      <div class="meta">
        <span class="net" id="net"></span>
        <button class="lang" id="btnLang" type="button" aria-label="Switch language">English</button>
      </div>
    </div>
  </div>

  <div class="setup" id="setupMsg" data-t-html="setup" hidden></div>

  <div class="card">
    <div>
      <label data-t="role">職別</label>
      <div class="roles" id="roles">
        <button type="button" data-role="保全員" data-t="roleSec" aria-pressed="false">保全員</button>
        <button type="button" data-role="清潔" data-t="roleClean" aria-pressed="false">清潔</button>
        <button type="button" data-role="總幹事" data-t="roleMgr" aria-pressed="false">總幹事</button>
      </div>
    </div>
    <div>
      <label for="name" data-t="name">姓名</label>
      <input id="name" maxlength="20" autocomplete="name" data-t-ph="namePh" placeholder="請輸入你的姓名">
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabClock" aria-selected="true"><span data-t="tabClock">上下班</span></button>
    <button role="tab" id="tabPatrol" aria-selected="false"><span data-t="tabPatrol">巡邏</span><span class="badge" id="badge" hidden>0</span></button>
  </div>

  <!-- 上下班 -->
  <section id="viewClock" style="display:flex;flex-direction:column;gap:12px">
    <div class="status" id="status"></div>
    <div class="btns">
      <button class="big in" id="btnIn" data-t="in">上班</button>
      <button class="big out" id="btnOut" data-t="out">下班</button>
    </div>
    <div id="clockRes" hidden></div>
    <div class="help" id="geoHelp" hidden>
      <b data-t="geoHelp">無法取得定位時：</b>
      <ol>
        <li data-t="geo1"></li>
        <li data-t="geo2"></li>
        <li data-t="geo3"></li>
      </ol>
    </div>
  </section>

  <!-- 巡邏 -->
  <section id="viewPatrol" hidden style="display:flex;flex-direction:column;gap:14px">
    <button class="big in" id="btnScan" data-t="scan">掃描巡邏點 QR Code</button>
    <div class="cam" id="cam" hidden>
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="tip" data-t="camTip">把 QR Code 對準框框</div>
    </div>
    <button class="btn" id="btnStop" data-t="stopCam" hidden>關閉相機</button>
    <div id="patrolRes" hidden></div>
    <div class="card">
      <div class="row"><b data-t="todayLog">今天的巡邏紀錄</b><button class="btn" id="btnSync" data-t="syncNow">立即上傳</button></div>
      <div class="status" id="syncMsg"></div>
      <div class="log" id="log"></div>
    </div>
    <p class="help" style="margin:0" data-t="offlineNote"></p>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
  /* ---- 文字（中文 / English） ---- */
  var L = {
    zh: {
      title:'值勤打卡', online:'有網路', offline:'離線中', langBtn:'English',
      setup:'尚未設定 Apps Script 網址。請在 GitHub 編輯 <b>config.js</b>，貼上你的網頁應用程式網址。',
      role:'職別', name:'姓名', namePh:'請輸入你的姓名', roleSec:'保全員', roleClean:'清潔', roleMgr:'總幹事',
      tabClock:'上下班', tabPatrol:'巡邏', remember:'這支手機會記住你的職別和姓名，下次不用再填。',
      in:'上班', out:'下班',
      geoHelp:'無法取得定位時：',
      geo1:'從 LINE 打開的話，請按右上角「⋯」選「用預設瀏覽器開啟」。',
      geo2:'iPhone：設定 → 隱私權與安全性 → 定位服務 → 開啟，Safari 設為「使用 App 期間」。',
      geo3:'Android：打開手機的「定位」，並在 Chrome 允許這個網站使用位置資訊。',
      scan:'掃描巡邏點 QR Code', camTip:'把 QR Code 對準框框', stopCam:'關閉相機',
      todayLog:'今天的巡邏紀錄', syncNow:'立即上傳',
      offlineNote:'沒有網路也可以掃描，紀錄會先存在手機裡，有網路時自動上傳。上傳前請不要清除瀏覽器資料。',
      checking:'查詢打卡狀態中…', openSince:'你在 {date} {time} 已上班，下班記得打卡。', noOpen:'目前沒有未下班的紀錄。',
      errRole:'請先選擇職別', errName:'請輸入姓名',
      notReady:'系統尚未設定完成', tellMgr:'請通知總幹事。',
      noNet:'目前沒有網路', noNetClock:'上下班打卡需要網路，請到收訊好的地方再試。',
      locating:'正在取得定位…', allowLoc:'第一次會詢問是否允許定位，請按「允許」。', punching:'定位完成，打卡中…',
      punchFail:'打卡失敗', tryAgain:'請再試一次',
      inDone:'上班打卡完成', outDone:'下班打卡完成',
      distLine:'{name}　距離社區 {d} 公尺', hoursLine:'本次工時 {h} 小時',
      connFail:'連線失敗', unstable:'網路不穩，請稍後再試一次。',
      geoFail:'無法取得定位', geoDenied:'你沒有允許定位，無法打卡。', geoTimeout:'定位逾時，請到窗邊或戶外再試一次。', geoOther:'目前無法取得定位。',
      logEmpty:'今天還沒有巡邏紀錄。', pending:'有 {n} 筆等待上傳', pendingOff:'（目前離線，有網路時會自動上傳）',
      allUp:'全部已上傳', uploading:'上傳中…', noNetSync:'目前沒有網路，有網路時會自動上傳。',
      stUp:'已上傳', stWait:'待上傳', stBad:'QR 無效', noGeo:'無定位', point:'巡邏點',
      fillFirst:'填好後再掃一次。', dup:'這個點剛剛已經掃過了',
      reading:'已讀到 QR Code，定位中…', noGeoOk:'收不到定位也會照常記錄。',
      unknownQr:'不認得這個 QR Code', unknownQr2:'已先記錄，請確認是不是社區的巡邏點。',
      patrolDone:'巡邏打卡完成', savedOffline:'目前離線，有網路時會自動上傳',
      noJsqr:'掃描功能還沒載入', noJsqr2:'請在有網路的地方重新打開一次這個頁面。',
      noCamApi:'這個瀏覽器不能使用相機', useSafari:'請改用 Safari 或 Chrome 打開。',
      camFail:'無法開啟相機', camFail2:'請允許這個網站使用相機。也可以直接用手機相機或 LINE 掃描 QR Code。'
    },
    en: {
      title:'Duty Clock', online:'Online', offline:'Offline', langBtn:'中文',
      setup:'The Apps Script URL is not set. Edit <b>config.js</b> on GitHub and paste your web app URL.',
      role:'Role', name:'Name', namePh:'Enter your name', roleSec:'Security', roleClean:'Cleaning', roleMgr:'Manager',
      tabClock:'Clock in/out', tabPatrol:'Patrol', remember:'This phone remembers your role and name for next time.',
      in:'Clock in', out:'Clock out',
      geoHelp:'If location isn\'t working:',
      geo1:'If you opened this in LINE, tap "⋯" at the top right and choose "Open in browser".',
      geo2:'iPhone: Settings → Privacy & Security → Location Services → on, and set Safari to "While Using the App".',
      geo3:'Android: turn on Location, then allow this site to use your location in Chrome.',
      scan:'Scan checkpoint QR code', camTip:'Fit the QR code inside the frame', stopCam:'Close camera',
      todayLog:'Today\'s patrol log', syncNow:'Upload now',
      offlineNote:'You can scan without internet. Scans are saved on this phone and upload automatically when you\'re back online. Don\'t clear browser data before they upload.',
      checking:'Checking your status…', openSince:'You clocked in at {date} {time}. Remember to clock out.', noOpen:'You\'re not clocked in right now.',
      errRole:'Choose your role first', errName:'Enter your name',
      notReady:'The system isn\'t set up yet', tellMgr:'Please tell the building manager.',
      noNet:'No internet connection', noNetClock:'Clocking in or out needs internet. Move to a spot with better signal and try again.',
      locating:'Getting your location…', allowLoc:'The first time, your phone asks for location access. Tap "Allow".', punching:'Location found. Saving…',
      punchFail:'Couldn\'t clock you in or out', tryAgain:'Please try again',
      inDone:'Clocked in', outDone:'Clocked out',
      distLine:'{name} · {d} m from the community', hoursLine:'Shift length: {h} hours',
      connFail:'Connection failed', unstable:'The connection is unstable. Try again in a moment.',
      geoFail:'Can\'t get your location', geoDenied:'Location access is off, so you can\'t clock in or out.', geoTimeout:'Location timed out. Move near a window or outside and try again.', geoOther:'Location isn\'t available right now.',
      logEmpty:'No patrol scans today.', pending:'{n} waiting to upload', pendingOff:' (offline — will upload when you\'re back online)',
      allUp:'All uploaded', uploading:'Uploading…', noNetSync:'No internet. Scans will upload when you\'re back online.',
      stUp:'Uploaded', stWait:'Waiting', stBad:'Invalid QR', noGeo:'no location', point:'Checkpoint',
      fillFirst:'Fill it in, then scan again.', dup:'You just scanned this checkpoint',
      reading:'QR code read. Getting location…', noGeoOk:'The scan is saved even without location.',
      unknownQr:'Unknown QR code', unknownQr2:'It was saved anyway. Check that this is one of the community\'s checkpoints.',
      patrolDone:'Checkpoint scanned', savedOffline:'Offline — will upload when you\'re back online',
      noJsqr:'The scanner hasn\'t loaded', noJsqr2:'Open this page again where you have internet.',
      noCamApi:'This browser can\'t use the camera', useSafari:'Open the page in Safari or Chrome instead.',
      camFail:'Can\'t open the camera', camFail2:'Allow this site to use the camera. You can also scan the QR code with your phone\'s camera app or LINE.'
    }
  };

  var URL_OK = window.SCRIPT_URL && window.SCRIPT_URL.indexOf('/exec') > 0 && window.SCRIPT_URL.indexOf('請貼上') < 0;
  var WK = ['日','一','二','三','四','五','六'];
  var role = '', busy = false, syncing = false;
  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function hm(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function get(k, def){ try { var v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch (e) { return def; } }
  function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function todayKey(ms){ var d = new Date(ms || Date.now()); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  var lang = get('tc_lang', null) || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en');
  function t(k, v){
    var s = (L[lang] && L[lang][k]) || L.zh[k] || k;
    return v ? s.replace(/\{(\w+)\}/g, function(m, x){ return v[x] !== undefined ? v[x] : m; }) : s;
  }
  function applyLang(){
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
    document.querySelectorAll('[data-t-html]').forEach(function(el){ el.innerHTML = t(el.getAttribute('data-t-html')); });
    document.querySelectorAll('[data-t-ph]').forEach(function(el){ el.placeholder = t(el.getAttribute('data-t-ph')); });
    $('btnLang').textContent = t('langBtn');
    var cfg = get('tc_cfg', null);
    if (cfg && cfg.org) $('org').textContent = cfg.org;
    document.title = (cfg && cfg.org ? cfg.org + ' ' : '') + t('title');
    $('clockRes').hidden = true; $('patrolRes').hidden = true;
    $('status').textContent = t('remember');
    net(); tick(); renderLog(); refreshStatus();
  }
  $('btnLang').onclick = function(){ lang = lang === 'en' ? 'zh' : 'en'; put('tc_lang', lang); applyLang(); };
  if (!URL_OK) $('setupMsg').hidden = false;

  /* ---- 時鐘與網路狀態 ---- */
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  function tick(){
    var d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('date').textContent = lang === 'en'
      ? DAY[d.getDay()] + ', ' + MON[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear()
      : '民國' + (d.getFullYear()-1911) + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 星期' + WK[d.getDay()];
  }
  setInterval(tick, 1000);
  function net(){ var on = navigator.onLine; $('net').textContent = on ? t('online') : t('offline'); $('net').className = 'net' + (on ? '' : ' off'); }
  window.addEventListener('online', function(){ net(); sync(); loadConfig(); });
  window.addEventListener('offline', net);

  /* ---- 與 Apps Script 溝通 ---- */
  function post(body, ms){
    body.lang = lang;
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, ms || 20000);
    return fetch(window.SCRIPT_URL, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal })
      .then(function(r){ return r.json(); })
      .finally(function(){ clearTimeout(tm); });
  }
  function loadConfig(){
    if (!URL_OK || !navigator.onLine) return;
    var ctl = new AbortController(), tm = setTimeout(function(){ ctl.abort(); }, 12000);
    fetch(window.SCRIPT_URL + '?action=config', { signal: ctl.signal })
      .then(function(r){ return r.json(); })
      .then(function(c){ if (c && c.ok){ put('tc_cfg', c); $('org').textContent = c.org; document.title = c.org + ' ' + t('title'); } })
      .catch(function(){})
      .finally(function(){ clearTimeout(tm); });
  }

  /* ---- 職別與姓名 ---- */
  function setRole(r){
    role = r;
    document.querySelectorAll('#roles button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-role') === r ? 'true' : 'false'); });
    put('tc_role', r); refreshStatus();
  }
  document.querySelectorAll('#roles button').forEach(function(b){ b.onclick = function(){ setRole(b.getAttribute('data-role')); }; });
  var nameT;
  $('name').addEventListener('input', function(){ put('tc_name', $('name').value.trim()); clearTimeout(nameT); nameT = setTimeout(refreshStatus, 800); });
  function who(){
    var name = $('name').value.trim();
    if (!role) return { err: t('errRole') };
    if (!name) return { err: t('errName') };
    return { name: name };
  }

  /* ---- 分頁 ---- */
  function tab(p){
    $('tabClock').setAttribute('aria-selected', p ? 'false' : 'true');
    $('tabPatrol').setAttribute('aria-selected', p ? 'true' : 'false');
    $('viewClock').hidden = !!p; $('viewPatrol').hidden = !p;
    if (!p) stopCam();
    put('tc_tab', p ? 'patrol' : 'clock');
  }
  $('tabClock').onclick = function(){ tab(false); };
  $('tabPatrol').onclick = function(){ tab(true); };

  function show(el, cls, html){ var r = $(el); r.className = 'res ' + cls; r.innerHTML = html; r.hidden = false; }

  /* ---- 定位 ---- */
  function locate(opts){
    return new Promise(function(res, rej){
      if (!navigator.geolocation) return rej({ code: 0 });
      navigator.geolocation.getCurrentPosition(function(p){ res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); }, rej, opts);
    });
  }

  /* ---- 上下班打卡（需要網路） ---- */
  function refreshStatus(){
    var w = who(); if (w.err || !URL_OK || !navigator.onLine) return;
    $('status').textContent = t('checking');
    post({ action: 'status', role: role, name: w.name }, 12000).then(function(r){
      $('status').textContent = r && r.open ? t('openSince', { date: r.open.date, time: r.open.time }) : t('noOpen');
    }).catch(function(){ $('status').textContent = ''; });
  }
  function lockBtns(on){ busy = on; $('btnIn').disabled = on; $('btnOut').disabled = on; }
  function punch(kind){
    if (busy) return;
    var w = who(); if (w.err) return show('clockRes', 'bad', '<b>' + w.err + '</b>');
    if (!URL_OK) return show('clockRes', 'bad', '<b>' + t('notReady') + '</b><span>' + t('tellMgr') + '</span>');
    if (!navigator.onLine) return show('clockRes', 'bad', '<b>' + t('noNet') + '</b><span>' + t('noNetClock') + '</span>');
    lockBtns(true); $('geoHelp').hidden = true;
    show('clockRes', 'wait', '<b>' + t('locating') + '</b><span>' + t('allowLoc') + '</span>');
    locate({ enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }).then(function(pos){
      show('clockRes', 'wait', '<b>' + t('punching') + '</b>');
      return post({ action: 'punch', role: role, name: w.name, kind: kind, lat: pos.lat, lng: pos.lng, acc: pos.acc }).then(function(r){
        if (!r || !r.ok) return show('clockRes', 'bad', '<b>' + t('punchFail') + '</b><span>' + esc(r ? r.msg : t('tryAgain')) + '</span>');
        show('clockRes', 'ok', '<b>' + (r.kind === 'in' ? t('inDone') : t('outDone')) + '</b>' +
          '<div class="tm mono">' + esc(r.time) + '</div><span>' + esc(t('distLine', { name: r.name, d: r.dist })) + '</span>' +
          (r.hours !== undefined ? '<span>' + t('hoursLine', { h: Number(r.hours).toFixed(2) }) + '</span>' : '') +
          (r.warn ? '<span style="color:var(--warn)">' + esc(r.warn) + '</span>' : ''));
        refreshStatus();
      }, function(){ show('clockRes', 'bad', '<b>' + t('connFail') + '</b><span>' + t('unstable') + '</span>'); });
    }, function(err){
      var msg = err.code === 1 ? t('geoDenied') : err.code === 3 ? t('geoTimeout') : t('geoOther');
      show('clockRes', 'bad', '<b>' + t('geoFail') + '</b><span>' + msg + '</span>'); $('geoHelp').hidden = false;
    }).finally(function(){ lockBtns(false); });
  }
  $('btnIn').onclick = function(){ punch('in'); };
  $('btnOut').onclick = function(){ punch('out'); };

  /* ---- 巡邏：紀錄存在手機，之後補傳 ---- */
  // tc_queue: 待上傳；tc_log: 今天的顯示紀錄
  function pointName(code){
    var cfg = get('tc_cfg', null);
    if (!cfg || !cfg.points || !window.crypto || !crypto.subtle) return Promise.resolve(null);
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(code)).then(function(buf){
      var h = Array.prototype.map.call(new Uint8Array(buf), function(b){ return (b < 16 ? '0' : '') + b.toString(16); }).join('').slice(0, 16);
      for (var i = 0; i < cfg.points.length; i++) if (cfg.points[i].h === h) return cfg.points[i].name;
      return null;
    }).catch(function(){ return null; });
  }
  function codeFrom(text){
    var m = String(text).match(/[#&?]p=([A-Za-z0-9]{4,40})/);
    if (m) return m[1];
    return /^[A-Za-z0-9]{4,40}$/.test(text) ? text : null;
  }
  function renderLog(){
    var log = get('tc_log', []).filter(function(x){ return todayKey(x.at) === todayKey(); });
    put('tc_log', log);
    var q = get('tc_queue', []);
    $('badge').textContent = q.length; $('badge').hidden = !q.length;
    $('log').innerHTML = log.length ? log.slice().reverse().map(function(x){
      var st = x.bad ? '<span class="pill p-bad">' + t('stBad') + '</span>' : x.up ? '<span class="pill p-ok">' + t('stUp') + '</span>' : '<span class="pill p-wait">' + t('stWait') + '</span>';
      return '<div class="it"><span class="t mono">' + hm(x.at) + '</span><span class="n">' + esc(x.name || t('point')) + (x.geo ? '' : ' <span class="t">· ' + t('noGeo') + '</span>') + '</span>' + st + '</div>';
    }).join('') : '<div class="status">' + t('logEmpty') + '</div>';
    $('syncMsg').textContent = q.length ? t('pending', { n: q.length }) + (navigator.onLine ? '' : t('pendingOff')) : (log.length ? t('allUp') : '');
  }

  var lastCode = '', lastAt = 0, recording = false;
  function recordScan(code){
    var w = who();
    if (w.err){ tab(true); show('patrolRes', 'bad', '<b>' + w.err + '</b><span>' + t('fillFirst') + '</span>'); return; }
    if (recording) return;
    if (code === lastCode && Date.now() - lastAt < 60000){ show('patrolRes', 'warn', '<b>' + t('dup') + '</b>'); return; }
    recording = true; lastCode = code; lastAt = Date.now();
    var at = Date.now(), id = at.toString(36) + Math.random().toString(36).slice(2, 8);
    try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
    show('patrolRes', 'wait', '<b>' + t('reading') + '</b><span>' + t('noGeoOk') + '</span>');
    pointName(code).then(function(name){
      return locate({ enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }).catch(function(){ return null; }).then(function(pos){
        var cfg = get('tc_cfg', null), bad = !!(cfg && cfg.points && !name);
        var scan = { id: id, code: code, at: at };
        if (pos){ scan.lat = pos.lat; scan.lng = pos.lng; scan.acc = pos.acc; }
        var q = get('tc_queue', []); q.push(scan); put('tc_queue', q);
        var log = get('tc_log', []); log.push({ id: id, at: at, name: name, geo: !!pos, up: false, bad: bad }); put('tc_log', log);
        if (bad) show('patrolRes', 'bad', '<b>' + t('unknownQr') + '</b><span>' + t('unknownQr2') + '</span>');
        else show('patrolRes', 'ok', '<b>' + t('patrolDone') + '</b><div class="tm mono">' + hm(at) + '</div><span>' + esc(name || t('point')) + '</span>' +
          (navigator.onLine ? '' : '<span>' + t('savedOffline') + '</span>'));
        renderLog(); sync();
      });
    }).finally(function(){ recording = false; });
  }

  function sync(){
    if (syncing || !URL_OK || !navigator.onLine) return;
    var q = get('tc_queue', []); if (!q.length) return;
    var w = who(); if (w.err) return;
    syncing = true; $('syncMsg').textContent = t('uploading');
    post({ action: 'patrol', role: role, name: w.name, scans: q.slice(0, 50) }, 25000).then(function(r){
      if (!r || !r.ok) throw r;
      var ok = {}; (r.accepted || []).forEach(function(i){ ok[i] = 1; });
      put('tc_queue', get('tc_queue', []).filter(function(s){ return !ok[s.id]; }));
      put('tc_log', get('tc_log', []).map(function(x){ if (ok[x.id]) x.up = true; return x; }));
    }).catch(function(){}).finally(function(){
      syncing = false; renderLog();
      if (get('tc_queue', []).length && navigator.onLine) setTimeout(sync, 15000);
    });
  }
  $('btnSync').onclick = function(){ if (!navigator.onLine){ $('syncMsg').textContent = t('noNetSync'); return; } sync(); };
  setInterval(sync, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden){ sync(); renderLog(); } });

  /* ---- 相機掃描 ---- */
  var stream = null, raf = 0, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  function stopCam(){
    cancelAnimationFrame(raf);
    if (stream){ stream.getTracks().forEach(function(tr){ tr.stop(); }); stream = null; }
    $('cam').hidden = true; $('btnStop').hidden = true; $('btnScan').hidden = false;
  }
  function startCam(){
    var w = who(); if (w.err) return show('patrolRes', 'bad', '<b>' + w.err + '</b>');
    if (!window.jsQR) return show('patrolRes', 'bad', '<b>' + t('noJsqr') + '</b><span>' + t('noJsqr2') + '</span>');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return show('patrolRes', 'bad', '<b>' + t('noCamApi') + '</b><span>' + t('useSafari') + '</span>');
    $('patrolRes').hidden = true;
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function(s){
      stream = s; var v = $('video'); v.srcObject = s; v.play();
      $('cam').hidden = false; $('btnStop').hidden = false; $('btnScan').hidden = true;
      loop();
    }).catch(function(){
      show('patrolRes', 'bad', '<b>' + t('camFail') + '</b><span>' + t('camFail2') + '</span>');
    });
  }
  function loop(){
    var v = $('video');
    if (stream && v.readyState >= 2 && v.videoWidth){
      var s = Math.min(640, v.videoWidth), h = Math.round(v.videoHeight * s / v.videoWidth);
      canvas.width = s; canvas.height = h; ctx.drawImage(v, 0, 0, s, h);
      var img = ctx.getImageData(0, 0, s, h), r = window.jsQR(img.data, s, h, { inversionAttempts: 'dontInvert' });
      if (r && r.data){
        var code = codeFrom(r.data);
        if (code){ stopCam(); recordScan(code); return; }
      }
    }
    raf = requestAnimationFrame(loop);
  }
  $('btnScan').onclick = startCam;
  $('btnStop').onclick = stopCam;

  /* ---- 啟動 ---- */
  var n = get('tc_name', ''); if (n) $('name').value = n;
  var r0 = get('tc_role', ''); if (r0){ role = r0; document.querySelectorAll('#roles button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-role') === r0 ? 'true' : 'false'); }); }
  tab(get('tc_tab', 'clock') === 'patrol');
  applyLang(); loadConfig(); sync();

  // 用手機相機或 LINE 掃 QR Code 進來（網址帶 #p=代碼）
  function fromHash(){
    var c = codeFrom(location.hash);
    if (c){ history.replaceState(null, '', location.pathname + location.search); tab(true); recordScan(c); }
  }
  fromHash();
  window.addEventListener('hashchange', fromHash);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
